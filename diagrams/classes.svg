<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220"><title>UML: диаграмма классов печатных изданий</title><rect width="1600" height="1220" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#162333">
<text x="800" y="40" text-anchor="middle" font-size="28">UML: диаграмма классов печатных изданий</text>
