<g fill="none" stroke="#263d56" stroke-width="2"><path d="M400 450 V370 H790 V338 M1200 450 V370 H790"/><path d="M790 318 L778 338 H802 Z" fill="white"/><path d="M1200 840 V736"/><path d="M1200 716 L1188 736 H1212 Z" fill="white"/></g>
<text x="40" y="1170">+ — публичный член; треугольник направлен к родительскому классу.</text>
<text x="40" y="1200">Значения по умолчанию опущены; у наследников показаны собственные поля.</text></g></svg>