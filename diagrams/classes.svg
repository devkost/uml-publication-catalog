<text x="436" y="216">+ __init__(name: str, pub_year: int)</text>
<text x="436" y="244">+ __eq__(other: object): bool</text>
<text x="436" y="272">+ __hash__(): int</text>
<text x="436" y="300">+ __str__(): str</text>
